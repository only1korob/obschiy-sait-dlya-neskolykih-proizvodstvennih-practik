{% extends "base.html" %}
{% block title %}Отчеты{% endblock %}

{% block content %}
<div class="gothic-card" style="width: 900px;">
    <h2>Учёт продаж</h2>
    <div style="background: #111; padding: 15px; border: 1px solid #333; margin-bottom: 20px;">
        <p style="color: #d4af37; margin: 0;">Фильтр по датам: <input type="text" placeholder="с"> <input type="text" placeholder="по"> <button style="width: auto; padding: 5px 15px;">Ок</button></p>
    </div>
    <table>
        <tr><th>№ Заказа</th><th>Дата</th><th>Статус</th><th>Сумма</th></tr>
        {% for o in orders %}
        <tr>
            <td>{{ o[0] }}</td>
            <td>{{ o[3] }}</td>
            <td style="color: #d4af37;">{{ o[2] }}</td>
            <td>{{ o[4] }} ₽</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
